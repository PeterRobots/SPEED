defaults:
  - base_config.yaml

experiment_name: stage_2_6_4

# accelerate args
gradient_accumulation_steps: 1
tracker_project_name: SPEED

# dataset args
dataset_name: LAVIB
val_dataset_name: SNU_FILM
dataloader:
  batch_size: 4
  shuffle: true
  drop_last: true
  num_workers: 16
val_dataloader:
  batch_size: 1
  num_workers: 8

# training args
epochs: 100
log_every_steps: 10
val_every_steps: 1000  # save ckpt after validation
visual_every_steps: 1000
validate_metric: LPIPS  # PSNR, SSIM, LPIPS, FloLPIPS, L1
init_val_metric_value: 1.0  # 0.0, 0.0, 1.0, 1.0, 1.0

optimizer:
  weight_decay: 1.0e-4
  betas: [0.9, 0.99]
  eps: 1.0e-6
base_lr: 1.0e-4
lr_scheduler: cosine
warmup_steps: 100

loss_function_args:
  lpips_loss_weight: 1.0
  dists_loss_weight: 1.0  # We found that DISTS loss is more stable than style loss.
  style_loss_weight: 0.0  # If using style loss, please set it to 20.
  lpips_loss_start: 0
  dists_loss_start: 0
  style_loss_start: 0
